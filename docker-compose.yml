services:
  redis:
    image: redis:7-alpine
    container_name: medi_manage_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medi_manage_api
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "5000:5000"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
